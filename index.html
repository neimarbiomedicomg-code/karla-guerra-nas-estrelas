<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Karla — Guerra nas Estrelas</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  height:100%;
  background:#050816;
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none
}
#wrap{
  width:100vw;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(#071127,#02040c);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom)
}
#hud{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:4px;
  padding:6px
}
.s{
  background:linear-gradient(180deg,#111d3b,#0b1429);
  border:1px solid #24345e;
  border-radius:8px;
  padding:4px 3px;
  text-align:center;
  font-size:9px;
  letter-spacing:.06em;
  color:#9fb3d9
}
.s b{
  display:block;
  font-size:15px;
  color:#fff;
  letter-spacing:0;
  font-variant-numeric:tabular-nums;
  transition:transform .15s
}
.s b.pop{transform:scale(1.3)}
#lives{color:#fb7185}
#immune.on{color:#22c55e}
#combo.hot{color:#fbbf24}
#stage{
  position:relative;
  flex:1;
  min-height:0
}
canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none
}
#overlay{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center,rgba(15,30,70,.85),rgba(2,6,23,.95));
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
  z-index:5
}
#overlay.hide{display:none}
#villainWrap{
  position:relative;
  width:min(46vw,190px);
  height:min(46vw,190px);
  margin:0 auto 22px;
  animation:float 3s ease-in-out infinite
}
#villainWrap::before{
  content:"";
  position:absolute;
  inset:-14px;
  border-radius:50%;
  background:conic-gradient(#ef3300,#ff9a00,#fff2a0,#ff9a00,#ef3300,#ff9a00,#fff2a0,#ff9a00,#ef3300);
  filter:blur(6px);
  animation:spin 2.4s linear infinite;
  opacity:.9
}
#villain{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  border:5px solid #ff8a00;
  box-shadow:0 0 30px rgba(255,120,0,.7),0 0 70px rgba(239,51,0,.35);
  display:block;
  background:#0d1730
}
#villainTag{
  position:absolute;
  left:50%;
  bottom:-12px;
  transform:translateX(-50%);
  background:#ef4444;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  letter-spacing:.15em;
  padding:4px 10px;
  border-radius:20px;
  box-shadow:0 4px 12px rgba(239,68,68,.5);
  white-space:nowrap
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#info:empty{display:none}
#card{max-width:560px;animation:rise .4s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{
  font-size:clamp(24px,7vw,38px);
  margin:0 0 12px;
  line-height:1.1;
  background:linear-gradient(180deg,#fff,#7dd3fc);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 24px rgba(56,189,248,.35)
}
p{
  line-height:1.45;
  opacity:.92;
  font-size:15px
}
#record{
  margin:4px 0 14px;
  font-size:14px;
  color:#fbbf24
}
#newrec{
  display:none;
  margin:0 0 10px;
  font-weight:bold;
  color:#fbbf24;
  font-size:18px;
  animation:blink .6s infinite alternate
}
@keyframes blink{from{opacity:.4}to{opacity:1}}
.keys{font-size:12px;opacity:.7;margin-top:10px}
button{
  border:0;
  border-radius:12px;
  padding:13px 22px;
  font-weight:bold;
  font-size:16px;
  color:#fff;
  background:linear-gradient(135deg,#2563eb,#0ea5e9);
  box-shadow:0 6px 20px rgba(14,165,233,.35);
  cursor:pointer;
  font-family:inherit
}
button:active{transform:scale(.97)}
#start{font-size:18px;padding:15px 34px}
.ctl{
  position:absolute;
  top:10px;
  padding:8px 12px;
  font-size:12px;
  background:#172341;
  box-shadow:none;
  z-index:4
}
#pause{right:10px}
#mute{right:96px}
@media (max-width:720px){
  #hud{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="s">PONTOS<b id="score">0</b></div>
    <div class="s">VIDAS<b id="lives">3</b></div>
    <div class="s">NÍVEL<b id="level">1</b></div>
    <div class="s">TEMPO<b id="time">0s</b></div>
    <div class="s">IMUNIDADE<b id="immune">OFF</b></div>
    <div class="s">PRÓX. ESPECIAL<b id="special">10s</b></div>
    <div class="s">COMBO<b id="combo">x1</b></div>
    <div class="s">RECORDE<b id="best">0</b></div>
  </div>

  <div id="stage">
    <canvas id="game"></canvas>

    <button id="mute" class="ctl">SOM: ON</button>
    <button id="pause" class="ctl">PAUSAR</button>

    <div id="overlay">
      <div id="card">
        <div id="villainWrap">
          <canvas id="villain" width="256" height="256"></canvas>
          <div id="villainTag">VILÃ</div>
        </div>
        <h1>KARLA — GUERRA NAS ESTRELAS</h1>
        <div id="newrec">★ NOVO RECORDE! ★</div>
        <p id="info"></p>
        <div class="keys" style="margin:0 0 8px;opacity:.85">A cada 1000 pontos sua nave ganha uma arma nova ⬆</div>
        <div id="record">Recorde: 0</div>
        <button id="start">JOGAR</button>
        <div class="keys">Computador: ← → ou A/D movem • Espaço atira • P pausa • M som</div>
      </div>
    </div>
  </div>
</div>

  // Sprites circulares pré-renderizados (bem mais rápido que recortar a cada quadro)
  const SPR = 256;
  const sprites = { enemy:null, special:null, hero:null };

  function makeSprite(img,zoom,xBias,yBias){
    const cv=document.createElement("canvas");
    cv.width=cv.height=SPR;
    const g=cv.getContext("2d");
    g.beginPath();
    g.arc(SPR/2,SPR/2,SPR/2,0,Math.PI*2);
    g.clip();
    const iw=img.naturalWidth||1, ih=img.naturalHeight||1;
    const sc=Math.max(SPR/iw,SPR/ih)*zoom;
    const dw=iw*sc, dh=ih*sc;
    g.drawImage(img,SPR/2-dw*xBias,SPR/2-dh*yBias,dw,dh);
    return cv;
  }

  function buildEnemySprites(){
    sprites.enemy=makeSprite(enemyImg,1.75,.43,.35);
    sprites.special=makeSprite(enemyImg,1.95,.43,.35);
    const vc=document.getElementById("villain");
    vc.getContext("2d").drawImage(sprites.special,0,0,vc.width,vc.height);
  }
  function buildHeroSprite(){
    sprites.hero=makeSprite(heroImg,1.35,.5,.42);
  }

  if(enemyImg.complete && enemyImg.naturalWidth) buildEnemySprites();
  else enemyImg.onload=buildEnemySprites;

  if(heroImg.complete && heroImg.naturalWidth) buildHeroSprite();
  else heroImg.onload=buildHeroSprite;

  // ---------- Áudio sintetizado (sem arquivos externos) ----------
  let ac=null, master=null, noiseBuf=null;

  function initAudio(){
    if(ac) { if(ac.state!=="running") ac.resume(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      ac=new AC();
      // compressor evita estourar quando vários sons tocam juntos
      const comp=ac.createDynamicsCompressor();
      comp.threshold.value=-14;
      comp.knee.value=10;
      comp.ratio.value=6;
      comp.connect(ac.destination);
      master=ac.createGain();
      master.gain.value=muted?0:1;
      master.connect(comp);
      // desbloqueio de áudio (iPhone/Android exigem um som após o toque)
      const sb=ac.createBuffer(1,1,22050);
      const ss=ac.createBufferSource();
      ss.buffer=sb; ss.connect(ac.destination); ss.start(0);
      noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }catch(e){ ac=null; }
  }

  function tone(type,f1,f2,dur,vol,delay){
    if(!ac||muted) return;
    const t0=ac.currentTime+(delay||0);
    const o=ac.createOscillator();
    const g=ac.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f1,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+.02);
  }

  function noise(dur,vol,freq,type){
    if(!ac||muted||!noiseBuf) return;
    const t0=ac.currentTime;
    const s=ac.createBufferSource();
    s.buffer=noiseBuf;
    const f=ac.createBiquadFilter();
    f.type=type||"lowpass";
    f.frequency.setValueAtTime(freq||1800,t0);
    f.frequency.exponentialRampToValueAtTime(120,t0+dur);
    const g=ac.createGain();
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0+dur);
  }

  function setMuted(m){
    muted=m;
    save("karla_muted",m?"1":"0");
    muteBtn.textContent=m?"SOM: OFF":"SOM: ON";
    if(master) master.gain.value=m?0:1;
  }

  // ---------- Estado ----------
  let W=0,H=0,last=0,running=false,paused=false,dying=0;
  let score=0,lives=3,t=0,dpr=1;
  let shield=0;      // imunidade do power-up (10s)
  let hurt=0;        // invencibilidade curta após levar dano
  let combo=0,comboT=0,mult=1;
  let level=1;
  let shake=0,flash=0,banner=null,warned=false;

  let ship={x:0,y:0,w:76,h:44};

  let shots=[], enemies=[], fires=[], powers=[], stars=[], sparks=[];
  let rocks=[], meteors=[], rockCd=3, meteorCd=4;
  let particles=[], floaters=[];

  let enemyCd=0, fireCd=0, powerCd=8, shotCd=0, nextSpecialAt=10;
  let weapon=0, ballCd=0, missileCd=0;

  // Upgrades da nave: a cada 1000 pontos uma arma nova e mais eficiente
  const S6=[-25,-15,-5,5,15,25];
  const UPGRADES=[
    {pts:0,    name:"LASER SIMPLES",        spread:[0],          rate:.12, color:"#eaf6ff", glow:"#38bdf8"},
    {pts:1000, name:"LASER TRIPLO",         spread:[-12,0,12],   rate:.12, color:"#a5f3fc", glow:"#22d3ee"},
    {pts:2000, name:"CHUVA DE 6 TIROS",     spread:S6,           rate:.11, color:"#c4b5fd", glow:"#8b5cf6"},
    {pts:3000, name:"LASER PERFURANTE",     spread:S6,           rate:.10, color:"#fde68a", glow:"#fbbf24", pierce:true, big:true},
    {pts:4000, name:"+ 3 BOLAS DE FOGO",    spread:S6,           rate:.10, color:"#fde68a", glow:"#fbbf24", pierce:true, big:true, balls:true},
    {pts:5000, name:"+ MÍSSEIS TELEGUIADOS",spread:S6,           rate:.09, color:"#fde68a", glow:"#fbbf24", pierce:true, big:true, balls:true, missiles:true},
    {pts:6000, name:"MODO SUPERNOVA",       spread:[-30,-20,-10,0,10,20,30], rate:.07, color:"#fecaca", glow:"#ef4444", pierce:true, big:true, balls:true, missiles:true}
  ];
  // dificuldade acompanha o upgrade da nave
  function tier(){ return weapon; }
  function weaponFor(s){
    let w=0;
    for(let i=0;i<UPGRADES.length;i++) if(s>=UPGRADES[i].pts) w=i;
    return w;
  }

  let touching=false, targetX=0;
  const keys={left:false,right:false,fire:false};

  function shipY(){ return H-Math.min(142*dpr,H*.22); }

  function makeStars(){
    stars=[];
    const layers=[[40,14,1],[30,34,1.6],[18,70,2.4]];
    for(const [n,v,s] of layers){
      for(let i=0;i<n;i++){
        stars.push({
          x:Math.random()*W,
          y:Math.random()*H,
          v:(v+Math.random()*v*.5)*dpr,
          s:s*dpr,
          a:.35+Math.random()*.6
        });
      }
    }
  }

  function resize(){
    const r=stage.getBoundingClientRect();
    const oldW=W||1;
    dpr=Math.min(window.devicePixelRatio||1,2);

    c.width=Math.max(1,Math.floor(r.width*dpr));
    c.height=Math.max(1,Math.floor(r.height*dpr));

    W=c.width;
    H=c.height;

    ship.w=76*dpr;
    ship.h=44*dpr;
    ship.y=shipY();
    ship.x=running ? ship.x*(W/oldW) : W/2;
    targetX=ship.x;

    makeStars();
    if(!running || paused) draw();
  }

  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,200));

  function reset(){
    score=0; lives=3; t=0;

  // ---------- HUD ----------
  const hudCache={};
  function setHud(el,key,val,pop){
    if(hudCache[key]===val) return;
    hudCache[key]=val;
    el.textContent=val;
    if(pop){
      el.classList.add("pop");
      setTimeout(()=>el.classList.remove("pop"),150);
    }
  }

  function hud(){
    setHud(scoreEl,"s",String(score),true);
    setHud(livesEl,"l",lives>0?"❤".repeat(Math.min(lives,5))+(lives>5?"+":""):"0",true);
    setHud(levelEl,"v",String(level),true);

    setHud(immuneEl,"i",shield>0?shield.toFixed(1)+"s":"OFF");

    setHud(bestEl,"b",String(Math.max(best,score)));
  }

  function speed(){
    return 1 + Math.floor(t/10)*0.18;
  }

  // ---------- Criação de entidades ----------
  function fireShot(){
    if(shotCd>0 || !running || paused || dying) return;

    const up=UPGRADES[weapon];
    const v=(up.big?900:760)*dpr;
    const n=up.spread.length;

    for(let k=0;k<n;k++){
      const a=up.spread[k]*Math.PI/180;
      // com muitos tiros, metade sai de cada asa
      const ox=n>=6 ? (k<n/2?-1:1)*ship.w*.22 : 0;
      shots.push({
        x:ship.x+ox,
        y:ship.y-ship.h/2-12*dpr,
        w:(up.big?8:6)*dpr,
        h:(up.big?24:18)*dpr,
        vx:Math.sin(a)*v,
        vy:Math.cos(a)*v,
        ang:a,
        r:(up.big?5:3)*dpr,
        color:up.color,
        glow:up.glow,
        pierce:!!up.pierce,
        hits:up.pierce?new Set():null
      });
    }

    // bolas de fogo (4000+): grandes e atravessam tudo
    if(up.balls && ballCd<=0){
      for(const deg of [-14,0,14]){
        const a=deg*Math.PI/180;
        shots.push({
          x:ship.x,
          y:ship.y-ship.h/2-16*dpr,
          vx:Math.sin(a)*560*dpr,
          vy:Math.cos(a)*560*dpr,
          ang:a,
          r:14*dpr,
          ball:true,
          pierce:true,
          hits:new Set()
        });
      }
      ballCd=.45;
      sfx.ball();
    }

    // mísseis teleguiados (5000+): perseguem o inimigo mais próximo
    if(up.missiles && missileCd<=0){
      for(const side of [-1,1]){
        shots.push({
          x:ship.x+side*ship.w*.45,
          y:ship.y,
          vx:side*260*dpr,
          vy:300*dpr,
          ang:0,
          r:6*dpr,
          missile:true,
          speed:620*dpr,
          life:3
        });
      }
      missileCd=.6;
      sfx.missile();
    }

    shotCd=up.rate;
    sfx.shoot();
  }

  function spawnEnemy(special){
    const sz=(special ? 92 : 74) + Math.random()*(special ? 26 : 22);
    const size=sz*dpr;
    const mult=speed()*(1+tier()*.12);

    const e={
      x:size/2 + Math.random()*(W-size),
      y:-size-10*dpr,
      w:size,
      h:size,
      v:(special ? 170 : 70+Math.random()*28)*dpr*mult*(special ? 1.55 : 1),
      drift:(Math.random()-.5)*(special ? 16 : 30)*dpr,
      phase:Math.random()*Math.PI*2,
      special:!!special,
      rot:0,
      vr:(Math.random()-.5)*.8
    };

    enemies.push(e);

    if(special){
      for(let i=0;i<18;i++){
        sparks.push({
          host:e,
          ang:(i/18)*Math.PI*2,
          rad:e.w*.62,
          spin:(1.5+Math.random()*1.8)*(Math.random()<.5?-1:1),
          life:999
        });
      }
    }
  }

  function spawnFire(){
    const w=tier();
    // tamanhos variados: quanto maior o nível, mais variação
    const rr=w===0 ? 15+Math.random()*12 : 8+Math.random()*(22+w*5);
    const r=rr*dpr;
    // bola pequena cai rápido, bola grande cai devagar
    const base=w===0 ? 230+Math.random()*130 : Math.max(130,560-rr*8)*(.75+Math.random()*.6);

    fires.push({
      x:r+Math.random()*(W-2*r),
      y:-2*r,
      r:r,
      v:base*dpr*speed()*(1+w*.06),
      sway:(Math.random()-.5)*(70+w*25)*dpr,
      flick:Math.random()*10
    });
  }

  // asteroides (a partir de 1000 pts): aguentam vários tiros, os grandes se partem
  function makeRock(px,py,r,vx,vy){
    const n=9, pts=[];
    for(let i=0;i<n;i++) pts.push(.72+Math.random()*.35);
    rocks.push({
      x:px,y:py,r:r,
      hp:1+Math.floor(r/(13*dpr)),
      vx:vx,vy:vy,
      rot:Math.random()*6,vr:(Math.random()-.5)*2,
      pts:pts,flash:0
    });
  }
  function spawnRock(){
    const w=tier();
    const r=(16+Math.random()*(18+w*6))*dpr;
    makeRock(
      r+Math.random()*(W-2*r),-r*2,r,
      (Math.random()-.5)*80*dpr,
      (80+Math.random()*90)*dpr*(1+w*.1)
    );
  }

  // meteoros (a partir de 2000 pts): pequenos, muito rápidos e na diagonal
  function spawnMeteor(){
    const w=tier();
    const fromLeft=Math.random()<.5;
    meteors.push({
      x:fromLeft ? Math.random()*W*.5 : W*.5+Math.random()*W*.5,
      y:-20*dpr,
      r:(5+Math.random()*4)*dpr,
      vx:(fromLeft?1:-1)*(120+Math.random()*200)*dpr,
      vy:(480+Math.random()*260)*dpr*(1+w*.06)
    });
  }

  function spawnPower(){
    const s=50*dpr;

    powers.push({
      x:s/2+Math.random()*(W-s),
      y:-s,
      w:s,
      h:s,
      v:92*dpr,
      ph:0
    });
  }

  // ---------- Efeitos ----------
  function burst(px,py,n,colors,spd,size){
    for(let i=0;i<n;i++){
      if(particles.length>450) particles.shift();
      const a=Math.random()*Math.PI*2;
      const v=(spd*.3+Math.random()*spd)*dpr;
      const life=.35+Math.random()*.55;
      particles.push({
        x:px,y:py,
        vx:Math.cos(a)*v,
        vy:Math.sin(a)*v,
        life:life,max:life,
        size:(size*.5+Math.random()*size)*dpr,
        color:colors[(Math.random()*colors.length)|0]
      });
    }
  }

  function floatText(px,py,txt,color,big){
    floaters.push({x:px,y:py,txt:txt,color:color,life:1,big:!!big});
  }

  function addShake(m){ shake=Math.max(shake,m*dpr); }

  function showBanner(txt,color,dur){
    banner={txt:txt,color:color,life:dur||1.4,max:dur||1.4};
  }

  // ---------- Colisões ----------
  function circleShip(cx,cy,r){
    const dx=cx-ship.x;
    const dy=cy-ship.y;
    const rr=r+Math.max(ship.w,ship.h)*.34;

    return dx*dx+dy*dy < rr*rr;
  }

  function pointInEnemy(px,py,e){
    // acerto circular (combina com o desenho redondo)
    const dx=px-e.x, dy=py-e.y, r=e.w/2;
    return dx*dx+dy*dy < r*r;
  }

  function removeEnemy(i){
    const e=enemies[i];
    enemies.splice(i,1);
    sparks=sparks.filter(s=>s.host!==e);
  }

  function damage(px,py){
    if(shield>0 || hurt>0) {
      if(shield>0 && px!==undefined){
        burst(px,py,10,["#22c55e","#86efac","#fff"],180,3);
      }
      return;
    }

    lives--;
    hurt=1.2;
    combo=0; mult=1; comboT=0;
    flash=.35;
    addShake(14);
    sfx.hit();
    if(navigator.vibrate){ try{ navigator.vibrate(120); }catch(e){} }

    burst(ship.x,ship.y,24,["#fb7185","#f97316","#fff"],260,4);

    if(lives<=0){
      startDying();
    }
  }

  function startDying(){
    dying=1.1;
    touching=false;
    burst(ship.x,ship.y,80,["#fff","#fde68a","#f97316","#ef4444","#38bdf8"],420,5);
    addShake(24);
    sfx.bigBoom();
  }

  function gameOver(){
    running=false;
    dying=0;

    const isRecord=score>best;
    if(isRecord){
      best=score;
      save("karla_best",String(best));
    }

    sfx.over();

    overlay.classList.remove("hide");
    titleEl.textContent="FIM DE JOGO";
    newrecEl.style.display=isRecord && score>0 ? "block" : "none";
    infoEl.innerHTML=
      "Pontuação: <b>"+score+"</b><br>"+
      "Tempo: <b>"+Math.floor(t)+"s</b><br>"+
      "Nível alcançado: <b>"+level+"</b>";
    recordEl.textContent="Recorde: "+best;

    start.textContent="JOGAR NOVAMENTE";
    hud();
  }

  // ---------- Atualização ----------
  function updateEffects(dt){
    for(const s of stars){
      s.y+=s.v*dt*(dying?0.4:1);
      if(s.y>H){
        s.y=0;
        s.x=Math.random()*W;
      }
    }

    for(const p of particles){
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      p.vx*=1-2.2*dt;
      p.vy*=1-2.2*dt;
      p.life-=dt;
    }
    particles=particles.filter(p=>p.life>0);

    for(const f of floaters){
      f.y-=60*dpr*dt;
      f.life-=dt*1.1;
    }
    floaters=floaters.filter(f=>f.life>0);

    if(banner){
      banner.life-=dt;
      if(banner.life<=0) banner=null;
    }

    shake=Math.max(0,shake-dt*60*dpr);
    flash=Math.max(0,flash-dt);
  }

  function update(dt){
    if(dying){
      dying-=dt;
      updateEffects(dt);
      for(const e of enemies){ e.y+=e.v*dt*.4; }
      for(const r of rocks){ r.y+=r.vy*dt*.4; r.rot+=r.vr*dt; }
      if(dying<=0) gameOver();
      return;
    }

    t+=dt;

    shield=Math.max(0,shield-dt);
    hurt=Math.max(0,hurt-dt);
    shotCd=Math.max(0,shotCd-dt);

    if(comboT>0){
      comboT-=dt;
      if(comboT<=0){ combo=0; mult=1; }
    }

    // novo nível
    const lv=1+Math.floor(t/10);
    if(lv>level){
      level=lv;
      showBanner("NÍVEL "+level,"#7dd3fc",1.4);
      sfx.level();
    }

    // aviso do especial
    if(!warned && nextSpecialAt-t<1.2){
      warned=true;
      sfx.warn();
    }

    if(t>=nextSpecialAt){
      spawnEnemy(true);
      nextSpecialAt+=10;
      warned=false;
    }

    // movimento pelo teclado
    if(keys.left||keys.right){
      const dir=(keys.right?1:0)-(keys.left?1:0);
      targetX=ship.x+dir*620*dpr*dt;
      ship.x=targetX;
    }

    if(touching){
      ship.x += (targetX-ship.x)*Math.min(1,dt*16);
    }

    if(touching||keys.fire){
      fireShot();
    }

    ship.x=Math.max(
      ship.w/2,
      Math.min(W-ship.w/2,ship.x)
    );

    // rastro do motor
    if(Math.random()<.8){
      particles.push({
        x:ship.x+(Math.random()<.5?-1:1)*ship.w*.15,
        y:ship.y+ship.h*.6,
        vx:(Math.random()-.5)*30*dpr,
        vy:(120+Math.random()*80)*dpr,
        life:.25,max:.25,
        size:(2+Math.random()*2)*dpr,
        color:shield>0?"#86efac":"#fb923c"
      });
    }

    enemyCd-=dt;
    fireCd-=dt;
    powerCd-=dt;

    // MAIS rostos
    if(enemyCd<=0){
      spawnEnemy(false);
      enemyCd=Math.max(
        .14,
        (.52-.02*Math.floor(t/10))/(1+tier()*.15)
      );
    }

    // MENOS fogo no início; a cada upgrade cai mais fogo
    if(fireCd<=0){
      const w=tier();
      const n=1+(Math.random()<w*.18?1:0)+(w>=4&&Math.random()<.4?1:0);
      for(let k=0;k<n;k++) spawnFire();
      fireCd=Math.max(.32,(1.35+Math.random()*.95)/(1+w*.45));
    }

    rockCd-=dt;
    if(tier()>=1 && rockCd<=0){
      spawnRock();
      rockCd=Math.max(.7,3.2-tier()*.4)+Math.random()*1.2;
    }

    meteorCd-=dt;
    if(tier()>=2 && meteorCd<=0){
      const n=tier()>=5?3:tier()>=3?2:1;
      for(let k=0;k<n;k++) spawnMeteor();
      meteorCd=Math.max(.6,2.6-tier()*.3)+Math.random();
    }

    if(powerCd<=0){
      spawnPower();
      powerCd=12+Math.random()*7;
    }

    ballCd=Math.max(0,ballCd-dt);
    missileCd=Math.max(0,missileCd-dt);

    for(const q of shots){
      if(q.missile){
        q.life-=dt;
        let tgt=null,bd=1e18;
        for(const e of enemies){
          const d=(e.x-q.x)**2+(e.y-q.y)**2;
          if(d<bd){bd=d;tgt=e;}
        }
        if(tgt){
          // vy positivo = subindo
          const dx=tgt.x-q.x, dy=q.y-tgt.y;
          const want=Math.atan2(dx,dy);
          let cur=Math.atan2(q.vx,q.vy);
          let diff=want-cur;
          while(diff>Math.PI) diff-=Math.PI*2;
          while(diff<-Math.PI) diff+=Math.PI*2;
          cur+=Math.max(-6*dt,Math.min(6*dt,diff));
          q.vx=Math.sin(cur)*q.speed;
          q.vy=Math.cos(cur)*q.speed;
        }
        q.ang=Math.atan2(q.vx,q.vy);
        if(Math.random()<.7){
          particles.push({
            x:q.x,y:q.y,
            vx:(Math.random()-.5)*20*dpr,vy:(Math.random()-.5)*20*dpr,
            life:.3,max:.3,size:3*dpr,
            color:Math.random()<.5?"#e5e7eb":"#f97316"
          });
        }
      }
      q.x+=q.vx*dt;
      q.y-=q.vy*dt;
      if(q.ball && Math.random()<.6){
        particles.push({
          x:q.x+(Math.random()-.5)*q.r,
          y:q.y+q.r*.6,
          vx:(Math.random()-.5)*30*dpr,
          vy:(60+Math.random()*60)*dpr,
          life:.3,max:.3,
          size:(3+Math.random()*3)*dpr,
          color:Math.random()<.5?"#fbbf24":"#f97316"
        });
      }
    }
    shots=shots.filter(q=>q.y>-40*dpr && q.x>-40*dpr && q.x<W+40*dpr && q.y<H+40*dpr && (!q.missile||q.life>0));

    for(const e of enemies){
      e.y+=e.v*dt;
      e.x+=Math.sin(e.phase+e.y*.01)*e.drift*dt;
      e.rot+=e.vr*dt;
    }

    for(const f of fires){
      f.y+=f.v*dt;
      f.x+=f.sway*dt;
      f.flick+=dt*20;
      if(Math.random()<.35){
        particles.push({
          x:f.x+(Math.random()-.5)*f.r,
          y:f.y-f.r*.6,
          vx:(Math.random()-.5)*20*dpr,
          vy:-(40+Math.random()*40)*dpr,
          life:.3,max:.3,
          size:(2+Math.random()*3)*dpr,
          color:Math.random()<.5?"#fbbf24":"#f97316"
        });
      }
    }
    fires=fires.filter(f=>f.y-f.r < H+40*dpr);

    for(const r of rocks){
      r.x+=r.vx*dt; r.y+=r.vy*dt; r.rot+=r.vr*dt;
      r.flash=Math.max(0,r.flash-dt);
    }
    rocks=rocks.filter(r=>r.y-r.r<H+60*dpr && r.x>-80*dpr && r.x<W+80*dpr);

    for(const m of meteors){
      m.x+=m.vx*dt; m.y+=m.vy*dt;
      particles.push({
        x:m.x,y:m.y,vx:0,vy:0,life:.22,max:.22,
        size:m.r*1.2,color:Math.random()<.5?"#e0f2fe":"#7dd3fc"
      });
    }
    meteors=meteors.filter(m=>m.y<H+40*dpr && m.x>-40*dpr && m.x<W+40*dpr);

    for(const p of powers){
      p.y+=p.v*dt;
      p.ph+=dt*4;
    }
    powers=powers.filter(p=>p.y-p.h/2 < H+40*dpr);

    for(const s of sparks){
      s.ang+=s.spin*dt;
    }

    // tiros x inimigos
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      let hit=false;

      for(let j=shots.length-1;j>=0;j--){
        const b=shots[j];

        if(b.pierce && b.hits.has(e)) continue;
        const dx=b.x-e.x, dy=b.y-e.y, rr=e.w/2+b.r;

        if(dx*dx+dy*dy < rr*rr){
          if(b.pierce) b.hits.add(e);    // perfurante / bola de fogo atravessa
          else shots.splice(j,1);
          removeEnemy(i);

          combo++;
          comboT=1.6;
          mult=Math.min(5,1+Math.floor(combo/5));

          const pts=(e.special ? 35 : 10)*mult;
          score+=pts;

          if(e.special){
            burst(e.x,e.y,50,["#fff","#fde68a","#f97316","#ef4444"],380,5);
            addShake(10);
            sfx.bigBoom();
            floatText(e.x,e.y,"+"+pts+"!", "#fbbf24",true);
          }else{
            burst(e.x,e.y,22,["#fff","#fb7185","#f97316","#fde68a"],260,4);
            addShake(3);
            sfx.boom();
            floatText(e.x,e.y,"+"+pts,mult>1?"#fbbf24":"#fff",false);
          }

          if(mult>1 && combo%5===0){
            showBanner("COMBO x"+mult,"#fbbf24",.9);
          }

          hit=true;
          break;
        }
      }

      if(hit) continue;

      if(circleShip(
        e.x,
        e.y,
        Math.max(e.w,e.h)*.42
      )){
        burst(e.x,e.y,18,["#fff","#fb7185","#f97316"],240,4);
        removeEnemy(i);
        damage(e.x,e.y);
        continue;
      }

      if(e.y+e.h/2>H){
        removeEnemy(i);
        // escudo verde também protege quem escapa pelo fundo
        if(shield<=0 && hurt<=0){
          floatText(e.x,H-30*dpr,"ESCAPOU!","#fb7185",false);
        }
        damage();
      }
    }

    // tiros x asteroides e meteoros
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i];
      for(let j=shots.length-1;j>=0;j--){
        const b=shots[j];
        if(b.pierce && b.hits.has(r)) continue;
        const dx=b.x-r.x, dy=b.y-r.y, rr=r.r+b.r;
        if(dx*dx+dy*dy<rr*rr){
          if(b.pierce) b.hits.add(r); else shots.splice(j,1);
          r.hp-=b.ball?3:1;
          r.flash=.08;
          burst(b.x,b.y,4,["#a8a29e","#d6d3d1"],120,3);
          if(r.hp<=0){
            rocks.splice(i,1);
            const pts=15*mult;
            score+=pts;
            burst(r.x,r.y,26,["#a8a29e","#78716c","#d6d3d1","#fbbf24"],260,5);
            floatText(r.x,r.y,"+"+pts,"#d6d3d1",false);
            sfx.boom();
            addShake(3);
            // asteroide grande se parte em dois
            if(r.r>30*dpr){
              for(const s of [-1,1]){
                makeRock(r.x,r.y,r.r*.55,s*(90+Math.random()*60)*dpr,r.vy*.9);
              }
            }
            break;
          }
        }
      }
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      for(let j=shots.length-1;j>=0;j--){
        const b=shots[j];
        const dx=b.x-m.x, dy=b.y-m.y, rr=m.r+b.r+4*dpr;
        if(dx*dx+dy*dy<rr*rr){
          if(!b.pierce) shots.splice(j,1);
          meteors.splice(i,1);
          score+=5*mult;
          burst(m.x,m.y,12,["#e0f2fe","#7dd3fc","#fff"],200,3);
          break;
        }
      }
    }

    // asteroides e meteoros x aeronave
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i];
      if(circleShip(r.x,r.y,r.r*.8)){
        burst(r.x,r.y,24,["#a8a29e","#78716c","#d6d3d1"],260,5);
        rocks.splice(i,1);
        damage(r.x,r.y);
      }
    }
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      if(circleShip(m.x,m.y,m.r)){
        burst(m.x,m.y,14,["#e0f2fe","#7dd3fc"],220,3);
        meteors.splice(i,1);
        damage(m.x,m.y);
      }
    }

    // fogo x aeronave
    for(let i=fires.length-1;i>=0;i--){
      const f=fires[i];

      if(circleShip(
        f.x,
        f.y,
        f.r*.72
      )){
        burst(f.x,f.y,14,["#fbbf24","#f97316","#ef4444"],220,4);
        fires.splice(i,1);
        damage(f.x,f.y);
      }
    }

    // powerup com seu rosto
    for(let i=powers.length-1;i>=0;i--){
      const p=powers[i];

      const dx=p.x-ship.x;
      const dy=p.y-ship.y;
      const rr=p.w*.5+ship.w*.35;

      if(dx*dx+dy*dy < rr*rr){
        burst(p.x,p.y,30,["#22c55e","#86efac","#fff"],260,4);
        powers.splice(i,1);
        shield=10;
        sfx.power();
        floatText(p.x,p.y,"IMUNE 10s","#22c55e",true);
      }
    }

    // upgrade da nave a cada mil pontos
    const w=weaponFor(score);
    if(w>weapon){
      weapon=w;
      showBanner("UPGRADE! "+UPGRADES[w].name,"#fbbf24",1.8);
      floatText(ship.x,ship.y-ship.h,"⬆ "+UPGRADES[w].name,"#fbbf24",true);
      floatText(W/2,H*.46,"⚠ O PERIGO AUMENTOU!","#fb7185",true);
      burst(ship.x,ship.y,40,["#fbbf24","#fde68a","#fff","#38bdf8"],300,4);
      sfx.upgrade();
    }

    updateEffects(dt);
    hud();
  }

  // ---------- Desenho ----------
  function drawFire(cx,cy,r,rot){
    ctx.save();

    ctx.translate(cx,cy);
    ctx.rotate(rot||0);

    const g=ctx.createRadialGradient(0,-r*.15,2,0,0,r);

    g.addColorStop(0,"#fff2a0");
    g.addColorStop(.45,"#ff9a00");
    g.addColorStop(1,"#ef3300");

    ctx.fillStyle=g;
    ctx.shadowBlur=16*dpr;
    ctx.shadowColor="#ff6800";

    ctx.beginPath();
    ctx.moveTo(0,-r*1.25);
    ctx.quadraticCurveTo(r*1.05,0,0,r);
    ctx.quadraticCurveTo(-r*1.05,0,0,-r*1.25);
    ctx.fill();

    ctx.shadowBlur=0;
    ctx.restore();
  }

  function drawShip(){
    // pisca durante a invencibilidade pós-dano
    if(hurt>0 && Math.floor(hurt*14)%2===0) return;

    ctx.save();
    ctx.translate(ship.x,ship.y);

    // leve inclinação conforme o movimento
    const tilt=Math.max(-.25,Math.min(.25,(targetX-ship.x)/(200*dpr)));
    ctx.rotate(touching||keys.left||keys.right ? tilt : 0);

    ctx.shadowBlur=(shield>0 ? 26 : 18)*dpr;
    ctx.shadowColor=shield>0 ? "#22c55e" : UPGRADES[weapon].glow;

    // corpo
    ctx.fillStyle="#f8fbff";
    ctx.beginPath();
    ctx.moveTo(0,-ship.h*.62);
    ctx.lineTo(ship.w*.15,ship.h*.12);
    ctx.lineTo(ship.w*.42,ship.h*.46);
    ctx.lineTo(ship.w*.12,ship.h*.34);
    ctx.lineTo(0,ship.h*.54);
    ctx.lineTo(-ship.w*.12,ship.h*.34);
    ctx.lineTo(-ship.w*.42,ship.h*.46);
    ctx.lineTo(-ship.w*.15,ship.h*.12);
    ctx.closePath();
    ctx.fill();

    // asas
    ctx.fillStyle="#bfe9ff";
    ctx.beginPath();
    ctx.moveTo(-ship.w*.12,ship.h*.02);
    ctx.lineTo(-ship.w*.50,ship.h*.26);
    ctx.lineTo(-ship.w*.18,ship.h*.24);
    ctx.lineTo(0,ship.h*.13);
    ctx.lineTo(ship.w*.18,ship.h*.24);
    ctx.lineTo(ship.w*.50,ship.h*.26);
    ctx.lineTo(ship.w*.12,ship.h*.02);
    ctx.closePath();
    ctx.fill();

    // canhões extras conforme o upgrade
    if(weapon>=1){
      ctx.fillStyle=UPGRADES[weapon].glow;
      ctx.fillRect(-ship.w*.46,ship.h*.05,ship.w*.06,ship.h*.30);
      ctx.fillRect(ship.w*.40,ship.h*.05,ship.w*.06,ship.h*.30);
    }
    if(weapon>=2){
      ctx.fillRect(-ship.w*.30,-ship.h*.05,ship.w*.05,ship.h*.28);
      ctx.fillRect(ship.w*.25,-ship.h*.05,ship.w*.05,ship.h*.28);
    }
    if(weapon>=5){
      ctx.fillStyle="#ef4444";
      ctx.fillRect(-ship.w*.50,ship.h*.15,ship.w*.07,ship.h*.18);
      ctx.fillRect(ship.w*.43,ship.h*.15,ship.w*.07,ship.h*.18);
    }
    if(weapon>=4){
      ctx.fillStyle="#f97316";
      ctx.beginPath();
      ctx.arc(0,-ship.h*.62,ship.w*.06,0,Math.PI*2);
      ctx.fill();
    }

    // cockpit
    ctx.fillStyle=shield>0 ? "#22c55e" : "#38bdf8";
    ctx.beginPath();
    ctx.ellipse(0,-ship.h*.12,ship.w*.09,ship.h*.18,0,0,Math.PI*2);
    ctx.fill();

    // propulsão (chama pulsante)
    const fl=.8+Math.random()*.5;
    ctx.shadowColor="#fb923c";
    ctx.fillStyle="#fb923c";
    ctx.fillRect(-ship.w*.20,ship.h*.36,ship.w*.10,ship.h*.22*fl);
    ctx.fillRect(ship.w*.10,ship.h*.36,ship.w*.10,ship.h*.22*fl);

    ctx.restore();

    if(shield>0){
      // escudo pisca nos últimos 2s para avisar que vai acabar
      const ending=shield<2 && Math.floor(shield*8)%2===0;
      if(!ending){
        ctx.strokeStyle="#22c55e";
        ctx.lineWidth=3*dpr;
        ctx.shadowBlur=16*dpr;
        ctx.shadowColor="#22c55e";

        ctx.beginPath();
        ctx.arc(ship.x,ship.y,ship.w*.58+Math.sin(t*8)*2*dpr,0,Math.PI*2);
        ctx.stroke();

        ctx.shadowBlur=0;
      }
    }
  }

  function draw(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,W,H);

    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#020617");
    g.addColorStop(1,"#091329");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // nebulosa suave
    const nb=ctx.createRadialGradient(W*.75,H*.25,0,W*.75,H*.25,Math.max(W,H)*.6);
    nb.addColorStop(0,"rgba(99,102,241,.10)");
    nb.addColorStop(1,"rgba(99,102,241,0)");
    ctx.fillStyle=nb;
    ctx.fillRect(0,0,W,H);

    // tremor de tela
    if(shake>0){
      ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    }

    // estrelas em camadas (parallax)
    for(const s of stars){
      ctx.globalAlpha=s.a;
      ctx.fillStyle="#fff";
      ctx.fillRect(s.x,s.y,s.s,s.s*(s.v>50*dpr?2.2:1));
    }
    ctx.globalAlpha=1;

    // asteroides
    for(const r of rocks){
      ctx.save();
      ctx.translate(r.x,r.y);
      ctx.rotate(r.rot);
      ctx.beginPath();
      for(let k=0;k<r.pts.length;k++){
        const a=k/r.pts.length*Math.PI*2;
        const d=r.r*r.pts[k];
        k===0?ctx.moveTo(Math.cos(a)*d,Math.sin(a)*d):ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);
      }
      ctx.closePath();
      const rg=ctx.createRadialGradient(-r.r*.3,-r.r*.3,1,0,0,r.r);
      rg.addColorStop(0,r.flash>0?"#fff":"#a8a29e");
      rg.addColorStop(1,r.flash>0?"#e7e5e4":"#44403c");
      ctx.fillStyle=rg;
      ctx.fill();
      ctx.lineWidth=2*dpr;
      ctx.strokeStyle="#292524";
      ctx.stroke();
      ctx.fillStyle="rgba(41,37,36,.55)";
      ctx.beginPath();
      ctx.arc(r.r*.25,r.r*.1,r.r*.18,0,Math.PI*2);
      ctx.arc(-r.r*.3,r.r*.3,r.r*.12,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // meteoros
    ctx.shadowBlur=12*dpr;
    ctx.shadowColor="#7dd3fc";
    ctx.fillStyle="#f0f9ff";
    for(const m of meteors){
      ctx.beginPath();
      ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur=0;

    // fogo aleatório
    for(const f of fires){
      drawFire(f.x,f.y,f.r*(1+Math.sin(f.flick)*.06),0);
    }

    // tiros com brilho (cor muda conforme a arma)
    ctx.shadowBlur=10*dpr;
    for(const b of shots){
      if(b.ball||b.missile) continue;
      ctx.shadowColor=b.glow;
      ctx.fillStyle=b.color;
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.ang);
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // mísseis
    for(const b of shots){
      if(!b.missile) continue;
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.ang);
      ctx.fillStyle="#e5e7eb";
      ctx.fillRect(-3*dpr,-9*dpr,6*dpr,16*dpr);
      ctx.fillStyle="#ef4444";
      ctx.beginPath();
      ctx.moveTo(-3*dpr,-9*dpr);ctx.lineTo(0,-14*dpr);ctx.lineTo(3*dpr,-9*dpr);
      ctx.fill();
      ctx.restore();
    }

    // bolas de fogo
    for(const b of shots){
      if(!b.ball) continue;
      drawFire(b.x,b.y,b.r,Math.PI+b.ang);
    }

    // fogo em volta do inimigo especial
    for(const s of sparks){
      const e=s.host;
      if(!e) continue;

      const cx=e.x + Math.cos(s.ang)*s.rad;
      const cy=e.y + Math.sin(s.ang)*s.rad;

      drawFire(cx,cy,10*dpr,s.ang);
    }

    // inimigos
    for(const e of enemies){
      const spr=e.special ? sprites.special : sprites.enemy;

      if(spr){
        ctx.save();
        ctx.translate(e.x,e.y);
        ctx.rotate(Math.sin(e.rot)*.25);
        ctx.drawImage(spr,-e.w/2,-e.h/2,e.w,e.h);
        ctx.restore();
      }

      ctx.lineWidth=(e.special ? 6 : 5)*dpr;
      ctx.strokeStyle=e.special ? "#ff8a00" : "#fb7185";

      ctx.beginPath();
      ctx.arc(e.x,e.y,e.w/2-3*dpr,0,Math.PI*2);
      ctx.stroke();

      if(e.special){
        ctx.lineWidth=2*dpr;
        ctx.strokeStyle="rgba(255,210,80,.95)";

        ctx.beginPath();
        ctx.arc(e.x,e.y,e.w/2+10*dpr,0,Math.PI*2);
        ctx.stroke();
      }
    }

    // powerup de imunidade
    for(const p of powers){
      const pulse=1+Math.sin(p.ph)*.06;
      const sz=p.w*pulse;

      if(sprites.hero){
        ctx.drawImage(sprites.hero,p.x-sz/2,p.y-sz/2,sz,sz);
      }

      ctx.lineWidth=5*dpr;
      ctx.strokeStyle="#22c55e";
      ctx.shadowBlur=18*dpr;
      ctx.shadowColor="#22c55e";

      ctx.beginPath();
      ctx.arc(p.x,p.y,sz/2-2*dpr,0,Math.PI*2);
      ctx.stroke();

      ctx.shadowBlur=0;

      ctx.fillStyle="#22c55e";
      ctx.font="bold "+(11*dpr)+"px Arial";
      ctx.textAlign="center";
      ctx.fillText("10s",p.x,p.y+p.w/2+14*dpr);
    }

    // partículas
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;

    if(running && !dying) drawShip();

    // textos flutuantes
    ctx.textAlign="center";
    for(const f of floaters){
      ctx.globalAlpha=Math.min(1,f.life*1.5);
      ctx.fillStyle=f.color;
      ctx.font="bold "+((f.big?20:14)*dpr)+"px Arial";
      ctx.fillText(f.txt,f.x,f.y);
    }
    ctx.globalAlpha=1;

    ctx.setTransform(1,0,0,1,0,0);

    // aviso do especial chegando
    if(running && !dying && nextSpecialAt-t<1.2 && Math.floor(t*6)%2===0){
      ctx.fillStyle="#ff8a00";
      ctx.font="bold "+(16*dpr)+"px Arial";
      ctx.textAlign="center";
      ctx.fillText("⚠ ESPECIAL CHEGANDO ⚠",W/2,62*dpr);
    }

    // banner (nível / combo)
    if(banner){
      const k=banner.life/banner.max;
      const a=Math.min(1,k*3,(1-k)*6);
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle=banner.color;
      ctx.shadowBlur=20*dpr;
      ctx.shadowColor=banner.color;
      ctx.font="bold "+(34*dpr)+"px Arial";
      ctx.textAlign="center";
      ctx.fillText(banner.txt,W/2,H*.38);
      ctx.shadowBlur=0;
      ctx.globalAlpha=1;
    }

    // clarão vermelho ao levar dano
    if(flash>0){
      const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.75);
      vg.addColorStop(0,"rgba(239,68,68,0)");
      vg.addColorStop(1,"rgba(239,68,68,"+(flash*1.6)+")");
      ctx.fillStyle=vg;
      ctx.fillRect(0,0,W,H);
    }

    // tela de pausa
    if(paused && running){
      ctx.fillStyle="rgba(2,6,23,.55)";
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#fff";
      ctx.font="bold "+(30*dpr)+"px Arial";
      ctx.textAlign="center";
      ctx.fillText("PAUSADO",W/2,H/2);
      ctx.font=(13*dpr)+"px Arial";
      ctx.fillStyle="#9fb3d9";
      ctx.fillText("Toque em CONTINUAR",W/2,H/2+26*dpr);
    }
  }

  function loop(now){
    if(!running || paused) return;

    const dt=Math.min(.033,(now-last)/1000 || 0);
    last=now;

    update(dt);
    draw();

    if(running && !paused){
      requestAnimationFrame(loop);
    }else if(!running){
      draw();
    }
  }

  // ---------- Desbloqueio de som no primeiro toque ----------
  ["touchstart","pointerdown","keydown"].forEach(ev=>{
    window.addEventListener(ev,()=>{ if(!muted) initAudio(); },{passive:true});
  });

  // ---------- Controles ----------
  function setTarget(clientX){
    const r=c.getBoundingClientRect();
    targetX=(clientX-r.left)*(c.width/r.width);
  }

  // TOUCH
  c.addEventListener("touchstart",e=>{
    if(!running || paused) return;
    e.preventDefault();
    touching=true;
    setTarget(e.touches[0].clientX);
    fireShot();
  },{passive:false});

  c.addEventListener("touchmove",e=>{
    if(!running) return;
    e.preventDefault();
    setTarget(e.touches[0].clientX);
  },{passive:false});

  c.addEventListener("touchend",e=>{
    e.preventDefault();
    if(e.touches.length===0) touching=false;
    else setTarget(e.touches[0].clientX);
  },{passive:false});

  c.addEventListener("touchcancel",()=>{ touching=false; });

  // MOUSE
  c.addEventListener("mousedown",e=>{
    if(!running || paused) return;
    touching=true;
    setTarget(e.clientX);
    fireShot();
  });

  window.addEventListener("mousemove",e=>{
    if(touching) setTarget(e.clientX);
  });

  window.addEventListener("mouseup",()=>{ touching=false; });

  // TECLADO
  function keyState(e,down){
    const k=e.key;
    if(k==="ArrowLeft"||k==="a"||k==="A"){ keys.left=down; e.preventDefault(); }
    else if(k==="ArrowRight"||k==="d"||k==="D"){ keys.right=down; e.preventDefault(); }
    else if(k===" "||k==="ArrowUp"||k==="w"||k==="W"){ keys.fire=down; e.preventDefault(); }
  }

  window.addEventListener("keydown",e=>{
    if(e.repeat && (e.key==="p"||e.key==="P"||e.key==="Escape"||e.key==="m"||e.key==="M")) return;
    if(e.key==="p"||e.key==="P"||e.key==="Escape"){ togglePause(); return; }
    if(e.key==="m"||e.key==="M"){ setMuted(!muted); return; }
    if(!running && (e.key==="Enter"||e.key===" ") && !overlay.classList.contains("hide")){
      e.preventDefault(); startGame(); return;
    }
    keyState(e,true);
  });

  window.addEventListener("keyup",e=>keyState(e,false));

  function togglePause(){
    if(!running || dying) return;

    paused=!paused;
    touching=false;
    keys.left=keys.right=keys.fire=false;

    pause.textContent=paused ? "CONTINUAR" : "PAUSAR";

    if(paused){
      draw();
    }else{
      initAudio();
      last=performance.now();
      requestAnimationFrame(loop);
    }
  }

  pause.onclick=togglePause;

  muteBtn.onclick=()=>{
    initAudio();
    setMuted(!muted);
  };

  // pausa sozinho se o usuário trocar de aba ou bloquear o celular
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden && running && !paused && !dying) togglePause();
  });

  window.addEventListener("blur",()=>{
    touching=false;
    keys.left=keys.right=keys.fire=false;
  });

  function startGame(){
    initAudio();

    overlay.classList.add("hide");
    titleEl.textContent=TITLE;
    infoEl.innerHTML=INFO_HTML;
    newrecEl.style.display="none";
    start.textContent="JOGAR";

    reset();

    running=true;
    paused=false;

    pause.textContent="PAUSAR";

    showBanner("NÍVEL 1","#7dd3fc",1.2);

    last=performance.now();
    requestAnimationFrame(loop);
  }

  start.onclick=startGame;

  // ---------- Inicialização ----------
  setMuted(muted);
  recordEl.textContent="Recorde: "+best;
  resize();
  reset();
  draw();
})();
</script>
</body>
</html>
